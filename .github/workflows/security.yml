name: Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 0 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary dependency gate until Snyk Open Source GitHub integration is verified.
  # Remove only after completing docs/11-ci-cd.md migration steps.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  semgrep:
    name: Semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.178.0
      - run: semgrep scan --config p/default --error --strict --metrics=off --disable-version-check apps packages
