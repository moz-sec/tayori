name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actions-lock:
    name: Workflow lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify action dependencies
        run: gh actions-lock --verify

  visual-changes:
    name: Detect visual changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: Check changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- apps/app/ packages/shared/ migrations/; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  visual:
    name: Visual regression
    needs: visual-changes
    if: needs.visual-changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --shm-size=1g
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:visual
      - name: Upload visual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-regression-diagnostics
          path: |
            output/playwright/
            apps/app/playwright-report/
          retention-days: 7

  test:
    name: Format, lint, test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-e2e-diagnostics
          path: |
            output/playwright/
            apps/app/playwright-report/
          retention-days: 7
