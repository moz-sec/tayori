minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: npm run format:check
        language: system
        pass_filenames: false
        always_run: true
      - id: oxlint
        name: oxlint
        entry: npm run lint:code
        language: system
        pass_filenames: false
        always_run: true
      - id: markdownlint
        name: markdownlint
        entry: npm run lint:md
        language: system
        pass_filenames: false
        always_run: true
